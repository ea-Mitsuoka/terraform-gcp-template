# CI — Layer 3 (authoritative) quality gate. Calls only canonical `make` targets
# (CLAUDE.md §11) so this file never changes when the stack changes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Runtime setup for this stack (runners do not ship terraform)
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false
      - run: make setup
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: make setup
      - run: make coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false
      - run: make setup
      - run: make build

  doctor:
    # Foundation self-check: metadata invariants (YAML frontmatter intact, no collapsed
    # frontmatter) + guard-hook block/allow tests. Catches the doc/rule regressions that
    # the no-op template Makefile can't. Dependency-free (pure bash).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: make doctor

  link-check:
    # Broken relative links in docs are a real defect (docs are the product here).
    # Offline mode: verify local file links resolve; external URLs are not fetched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check links (offline)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: "--offline --no-progress ."
          fail: true

  pr-quality:
    # PR hygiene: Conventional Commit title (WF-030) + size guard (GR-020)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out policy implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Resolve the current pull-request body
        # The event payload freezes the body at creation. Template Sync records the
        # direct-parent provenance seconds later, so a policy that reads the payload
        # judges a body the pull request no longer has.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' \
            > "${RUNNER_TEMP}/pr-body.md"
      - name: PR size guard (GR-020)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          FILES: ${{ github.event.pull_request.changed_files }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          PR_BODY="$(cat "${RUNNER_TEMP}/pr-body.md")"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            > "${RUNNER_TEMP}/pr-files.json"
          python3 src/ci/pr_size_policy.py \
            --files-json "${RUNNER_TEMP}/pr-files.json" \
            --additions "${ADDITIONS}" \
            --deletions "${DELETIONS}" \
            --files "${FILES}" \
            --pr-author "${PR_AUTHOR}" \
            --head-repository "${HEAD_REPOSITORY}" \
            --target-repository "${TARGET_REPOSITORY}" \
            --head-ref "${HEAD_REF}" \
            --base-ref "${BASE_REF}" \
            --pr-body "${PR_BODY}"
